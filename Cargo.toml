[package]
name = "rustmas"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rustmas"
path = "src/bin/main.rs"


[lib]
path = "src/lib/lib.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
dotenvy = "0.15.7"
hex = "0.4.3"
html2text = "0.17.1"
reqwest = { version = "0.13.4", features = ["blocking", "form"] }
sha2 = "0.11.0"
thiserror = "2.0.19"
